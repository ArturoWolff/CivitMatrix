[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "civitmatrix"
version = "1.0.0"
description = "Batch download CivitAI models with Stability Matrix–native sidecars"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Arturo Wolff" }]
keywords = [
  "stability-matrix",
  "civitai",
  "lora",
  "batch-download",
  "stable-diffusion",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "requests>=2.31.0",
  "python-dotenv>=1.0.0",
  "blake3>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/ArturoWolff/CivitMatrix"
Repository = "https://github.com/ArturoWolff/CivitMatrix"
Issues = "https://github.com/ArturoWolff/CivitMatrix/issues"
Funding = "https://ko-fi.com/arturowolff"
Linktree = "https://linktr.ee/ArturoWolff"

[project.scripts]
civitmatrix = "civitmatrix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
civitmatrix = ["ui/static/*"]
